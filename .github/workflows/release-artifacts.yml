name: Release Artifacts

on:
  workflow_dispatch:
    inputs:
      signed:
        description: Build a signed, notarized, and stapled DMG
        required: true
        default: false
        type: boolean
  push:
    tags:
      - "v*"

jobs:
  build-dmg:
    name: Build DMG Artifact
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Show Xcode Version
        run: xcodebuild -version

      - name: Import Developer ID Certificate
        if: startsWith(github.ref, 'refs/tags/v') || inputs.signed
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          KEYCHAIN_PATH: ${{ runner.temp }}/scrshot-signing.keychain-db
        run: ./scripts/install-ci-macos-certificate.sh

      - name: Build DMG
        env:
          DMG_BASENAME: scrshot-${{ github.ref_name }}
          OUTPUT_DIR: ${{ github.workspace }}/build/artifacts
          DERIVED_DATA_PATH: ${{ runner.temp }}/scrshot-release-derived-data
          KEYCHAIN_PATH: ${{ runner.temp }}/scrshot-signing.keychain-db
          SIGNING_ALLOWED: ${{ (startsWith(github.ref, 'refs/tags/v') || inputs.signed) && 'YES' || 'NO' }}
          NOTARIZATION_ALLOWED: ${{ (startsWith(github.ref, 'refs/tags/v') || inputs.signed) && 'YES' || 'NO' }}
          DEVELOPMENT_TEAM_VALUE: ${{ secrets.APPLE_TEAM_ID }}
          CODE_SIGN_IDENTITY_VALUE: AUTO
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: ./scripts/build-dmg.sh

      - name: Delete Temporary Keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/scrshot-signing.keychain-db" || true

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: scrshot-dmg-${{ github.ref_name }}
          path: |
            build/artifacts/*.dmg
            build/artifacts/*.sha256
          if-no-files-found: error
          retention-days: 30
