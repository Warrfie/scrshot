name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Build And Test
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Show Xcode Version
        run: xcodebuild -version

      - name: Build And Test
        run: >
          xcodebuild test
          -project scrshot.xcodeproj
          -scheme scrshot
          -derivedDataPath $RUNNER_TEMP/scrshot-derived-data
          CODE_SIGNING_ALLOWED=NO
          -destination 'platform=macOS'
